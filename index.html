<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venta Mendoza — Encerrada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  .card {
    text-align: center;
    padding: 3rem 2.5rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    max-width: 480px;
    width: 90%;
    backdrop-filter: blur(10px);
  }
  .icon { font-size: 4rem; margin-bottom: 1.2rem; }
  h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.6rem; letter-spacing: -0.5px; }
  .sub { font-size: 1.05rem; color: rgba(255,255,255,0.65); line-height: 1.6; }
  .badge {
    display: inline-block;
    margin-top: 1.8rem;
    padding: 0.4rem 1.2rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>¡Todo vendido!</h1>
  <p class="sub">Esta venta ya fue encerrada.<br>Gracias a todos por el interés.</p>
  <div class="badge">Godoy Cruz, Mendoza · 2025</div>
</div>
</body>
</html>
